<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>fx-82ZA PLUS — manual-faithful browser simulator</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="fx-82ZA PLUS">
<meta name="application-name" content="fx-82ZA PLUS">
<meta name="theme-color" content="#ededed">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  background:#ededed;
  font-family:Arial,Helvetica,sans-serif;
  -webkit-text-size-adjust:100%;
}
body{
  overscroll-behavior-y:contain;
}
button{
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  user-select:none;
  -webkit-user-select:none;
}
body{min-height:100vh;display:flex;justify-content:center;padding:10px}
.wrap{width:min(100%,900px)}
.calc{position:relative;width:100%;aspect-ratio:1/1;background:#fff;border-radius:18px;overflow:hidden;outline:none}
.photo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
}
.lcd{position:absolute;left:30.15%;top:13.95%;width:39.7%;height:15.7%;padding:.85% 1.3%;border-radius:10px;
background:linear-gradient(#dce9df,#c9d8ce);box-shadow:inset 0 0 9px rgba(0,0,0,.16);color:#0d2046;filter:contrast(var(--lcd-contrast,1));
font-family:"Courier New",monospace;display:grid;grid-template-rows:9% 46% 37% 8%;overflow:hidden;pointer-events:none}
#ind{font-size:clamp(7px,1.18vw,13px);font-weight:700;text-align:right;white-space:nowrap}
#expr,#result{display:flex;align-items:center;min-width:0;overflow:hidden;white-space:nowrap}
#expr{font-size:clamp(12px,2.25vw,23px);font-weight:700;justify-content:flex-start}
#result{font-size:clamp(13px,2.45vw,26px);font-weight:700;justify-content:flex-end}
#sub{font-size:clamp(6px,.9vw,10px);text-align:right;white-space:nowrap;overflow:hidden}
#expr,#result{
  font-family:"Courier New","DejaVu Sans Mono",monospace;
  color:#0d2046;
}
.math-line{
  display:inline-flex;
  align-items:center;
  white-space:nowrap;
  line-height:1;
}
.math-atom{display:inline-block}
.math-op{display:inline-block;margin:0 .04em}
.math-group{display:inline-flex;align-items:center}
.math-power{
  display:inline-flex;
  align-items:flex-start;
  vertical-align:baseline;
}
.math-power>.math-base{display:inline-flex;align-items:center}
.math-power>sup{
  position:relative;
  top:-.08em;
  margin-left:.03em;
  font-size:.62em;
  line-height:1;
  font-weight:700;
}
.math-frac{
  display:inline-grid;
  grid-template-rows:auto 1px auto;
  grid-template-columns:max-content;
  align-items:center;
  justify-items:center;
  vertical-align:middle;
  width:max-content;
  min-width:0;
  margin:0 .06em;
  line-height:.9;
}
.math-frac>.top,
.math-frac>.bottom{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:max-content;
  min-width:0;
  padding:0;
  font-size:.88em;
}
.math-frac>.bar{
  width:100%;
  min-width:0;
  height:1px;
  background:#0d2046;
  border-radius:1px;
}
.math-sqrt{
  display:inline-flex;
  align-items:flex-start;
  vertical-align:middle;
}
.math-sqrt>.radical{
  font-family:serif;
  font-size:1.20em;
  line-height:1;
  margin-right:-.06em;
}
.math-sqrt>.radicand{
  display:inline-flex;
  align-items:center;
  border-top:2px solid #0d2046;
  padding:.05em .08em 0 .08em;
  min-height:1em;
}
.math-root{
  display:inline-flex;
  align-items:flex-start;
  position:relative;
}
.math-root>.index{
  font-size:.48em;
  position:relative;
  left:.28em;
  top:-.08em;
  z-index:1;
}
.math-sub{
  display:inline-flex;
  align-items:flex-end;
}
.math-sub>sub{
  font-size:.58em;
  line-height:1;
}
.math-cursor{
  display:inline-block;
  width:3px;
  height:1.02em;
  margin-left:.05em;
  background:#10204b;
  border-radius:1px;
  vertical-align:middle;
  animation:casioCursorBlink 1.05s steps(1,end) infinite;
}

.slot-wrap{display:inline-flex;align-items:center;white-space:nowrap}
.slot-box{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:.72em;min-height:1em;border:1px solid #10204b;
  padding:0 .04em;margin:0 .03em
}
.slot-box.active{border-width:2px}
.mixed-template{display:inline-flex;align-items:center;gap:.08em}

.linear{font-family:"Courier New","DejaVu Sans Mono",monospace}

/* Casio-style Natural Display fraction-entry template */
.casio-frac-line{
  display:inline-flex;
  align-items:center;
  min-width:0;
  white-space:nowrap;
}
.casio-frac{
  display:inline-grid;
  grid-template-rows:auto 1px auto;
  grid-template-columns:max-content;
  align-items:center;
  justify-items:start;
  vertical-align:middle;
  margin:0 .06em;
  width:max-content;
  min-width:0;
  color:#0d2046;
  font-family:"Courier New","DejaVu Sans Mono",monospace;
  font-weight:700;
  line-height:.96;
}
.casio-frac-num,
.casio-frac-den{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:flex-start;
  width:max-content;
  min-width:0;
  min-height:1.12em;
  padding:0;
  font-size:.95em;
}
.casio-frac-bar{
  width:100%;
  min-width:0;
  height:1px;
  background:#0d2046;
  border-radius:1px;
  align-self:center;
}
.casio-frac-num.active::after,
.casio-frac-den.active::after{
  content:"";
  display:inline-block;
  width:3px;
  height:1.08em;
  margin-left:.07em;
  background:#10204b;
  border-radius:1px;
  vertical-align:middle;
  animation:casioCursorBlink 1.05s steps(1,end) infinite;
}
.casio-frac-num.empty::before,
.casio-frac-den.empty::before{
  content:"";
  display:inline-block;
  width:.10em;
  height:1em;
}
@keyframes casioCursorBlink{
  0%,54%{opacity:1}
  55%,100%{opacity:0}
}
@media (prefers-reduced-motion: reduce){
  .casio-frac-num.active::after,
  .casio-frac-den.active::after{animation:none}
}
.linear{font-family:"Courier New",monospace}
.hit,.replay{
  position:absolute;
  z-index:5;
  border:0;
  background:transparent;
  padding:0;
  cursor:pointer;
  border-radius:16%;
  touch-action:manipulation;
  transition:background-color 55ms ease-out, transform 55ms ease-out;
}
.replay{border-radius:50%}
.hit:active,.replay:active,.hit.pressed,.replay.pressed{
  background:rgba(255,255,255,.16);
  transform:scale(.985);
}
.hit:focus-visible,.replay:focus-visible{
  outline:1px solid rgba(16,32,75,.55);
  outline-offset:1px;
}
.info{display:none}
@media(max-width:520px){body{padding:0}.calc{border-radius:0}.info{font-size:10px}}

/* ==========================================================
   iPhone 12 presentation layer
   The calculator engine below is unchanged from FINAL MAX.
   ========================================================== */
html,body{
  width:100%;
  height:100%;
  min-height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  background:#ededed;
}
body{
  position:fixed;
  inset:0;
  min-height:100dvh;
  height:100dvh;
  margin:0;
  padding:
    max(env(safe-area-inset-top), 2px)
    0
    max(env(safe-area-inset-bottom), 2px);
  display:flex;
  align-items:center;
  justify-content:center;
  touch-action:manipulation;
}
.wrap{
  /* The source product photo is square while the calculator body occupies
     about 52% of its width. Enlarging the square makes the physical
     calculator fill almost the entire iPhone 12 width. */
  width:min(
    185vw,
    calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 6px)
  );
  max-width:none;
  min-width:0;
  flex:0 0 auto;
  margin:0;
  padding:0;
}
.calc{
  width:100%;
  border-radius:0;
  -webkit-transform:translateZ(0);
  transform:translateZ(0);
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
.photo{
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
.hit,.replay{
  cursor:default;
  touch-action:manipulation;
}
/* Keep Safari / standalone mode from showing selection or callout UI. */
#calc, #calc *{
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
}
/* Landscape is still usable, but portrait is the intended iPhone layout. */
@media (orientation:landscape){
  .wrap{
    width:min(
      96vh,
      calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 4px)
    );
  }
}
@supports not (height:100dvh){
  body{height:100vh;min-height:100vh}
  .wrap{width:min(185vw,100vh)}
}


/* Extra-extra-large LCD numbers for iPhone */
#expr{font-size:clamp(20px,3.8vw,34px)}
#result{font-size:clamp(25px,4.5vw,40px)}

</style>
</head>

const label = {
  SHIFT:"SHIFT", ALPHA:"ALPHA", MODE:"MODE", ON:"ON",
  ABS:"Abs", CUBE:"x³", INV:"x⁻¹", LOGBASE:"log□",
  FRAC:"a b/c", SQRT:"√", SQUARE:"x²", POWER:"x^", LOG:"log", LN:"ln",
  NEG:"(−)", DMS:"°′″", HYP:"hyp", SIN:"sin", COS:"cos", TAN:"tan",
  RCL:"RCL", ENG:"ENG", LP:"(", RP:")", SD:"S⇔D", MPLUS:"M+",

/* ---------- Natural Textbook Display renderer ---------- */
function mh(s){
  return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function mtok(s){
  const out=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){i++;continue;}
    if(/[0-9.]/.test(c)){
      let j=i+1; while(j<s.length && /[0-9.]/.test(s[j]))j++;
      out.push({t:"num",v:s.slice(i,j)}); i=j; continue;
    }
    if(/[A-Za-z]/.test(c)){
      let j=i+1; while(j<s.length && /[A-Za-z0-9#]/.test(s[j]))j++;
      out.push({t:"id",v:s.slice(i,j)}); i=j; continue;
    }
    if(c==="π"){out.push({t:"id",v:"π"});i++;continue;}
    if("+-−×÷*/^(),!%:".includes(c)){out.push({t:c,v:c});i++;continue;}
    // common display-only symbols
    if("°′″".includes(c)){out.push({t:"post",v:c});i++;continue;}
    // unsupported character -> preserve as literal
    out.push({t:"lit",v:c}); i++;
  }
  out.push({t:"eof",v:""});
  return out;
}
function parsePretty(s){
  const ts=mtok(s); let p=0;
  const peek=()=>ts[p], take=()=>ts[p++];
  const primaryStart=t=>t && (t.t==="num"||t.t==="id"||t.t==="(");
  function primary(){
    let t=peek();
    if(t.t==="num"){take();return {k:"num",v:t.v};}
    if(t.t==="id"){
      take();
      if(peek().t==="("){
        take(); const args=[];
        if(peek().t!==")" && peek().t!=="eof"){
          args.push(add());
          while(peek().t===","){take();args.push(add());}
        }
        let closed=false;
        if(peek().t===")"){take();closed=true;} // do not invent a closing bracket while typing
        return {k:"fn",n:t.v,a:args,closed};
      }
      return {k:"id",v:t.v};
    }
    if(t.t==="("){
      take(); const x=add();
      let closed=false;
      if(peek().t===")"){take();closed=true;}
      return {k:"group",x,closed};
    }
    if(t.t==="lit"){take();return {k:"id",v:t.v};}
    // empty placeholder while typing
    return {k:"empty"};
  }
  function post(){
    let x=primary();
    while(peek().t==="!"||peek().t==="%"||peek().t==="post"){
      const t=take(); x={k:"post",op:t.v,x};
    }
    return x;
  }
  function power(){
    let x=post();
    if(peek().t==="^"){take();x={k:"pow",a:x,b:unary()};}
    return x;
  }
  function unary(){
    if(peek().t==="-"||peek().t==="−"){take();return {k:"neg",x:unary()};}
    if(peek().t==="+"){take();return unary();}
    return power();
  }
  function mul(){
    let x=unary();
    while(true){
      const t=peek();
      if(["×","*","÷","/"].includes(t.t)){
        take(); x={k:"bin",op:t.t,a:x,b:unary()}; continue;
      }
      // Natural Display implicit multiplication: 2π, 2sin(30), 2(A+B), etc.
      if(primaryStart(t)){
        x={k:"bin",op:"implicit",a:x,b:unary()}; continue;
      }
      break;
    }
    return x;
  }
  function add(){
    let x=mul();
    while(peek().t==="+"||peek().t==="-"||peek().t==="−"){
      const op=take().t; x={k:"bin",op,a:x,b:mul()};
    }
    return x;
  }
  const ast=add();
  if(peek().t!=="eof") throw new Error("pretty parse");
  return ast;
}
function mrow(x){return `<span class="math-line">${x}</span>`;}

function mast(n){
  if(!n)return "";

  switch(n.k){
    case "num":
      return `<span class="math-atom">${mh(n.v)}</span>`;

    case "id":
      if(n.v==="ECONST") return `<span class="math-atom">e</span>`;
      return `<span class="math-atom">${mh(n.v)}</span>`;

    case "empty":
      return `<span class="math-atom">&nbsp;</span>`;

    case "group":{
      const body=n.x&&n.x.k==="empty"?"":mast(n.x);
      return `<span class="math-group"><span>(</span>${body}${n.closed?'<span>)</span>':''}</span>`;
    }

    case "neg":
      return `<span class="math-line"><span class="math-op">−</span>${mast(n.x)}</span>`;

    case "post":
      return `<span class="math-line">${mast(n.x)}<span class="math-op">${mh(n.op)}</span></span>`;

    case "pow":
      return `<span class="math-power"><span class="math-base">${mast(n.a)}</span><sup>${mast(n.b)}</sup></span>`;

    case "bin":{
      if(n.op==="/"){
        const aa=n.a&&n.a.k==="group"?n.a.x:n.a;
        const bb=n.b&&n.b.k==="group"?n.b.x:n.b;

        return `<span class="math-frac">
          <span class="top">${mast(aa)}</span>
          <span class="bar"></span>
          <span class="bottom">${mast(bb)}</span>
        </span>`;
      }

      const op =
        n.op==="implicit" ? "" :
        n.op==="*" ? "×" :
        n.op==="-" ? "−" :
        n.op;

      return `<span class="math-line">${mast(n.a)}${op?`<span class="math-op">${mh(op)}</span>`:""}${mast(n.b)}</span>`;
    }

    case "fn":{
      const a=n.a||[];
      const arg=a[0]?mast(a[0]):`<span class="math-atom">&nbsp;</span>`;

      if(n.n==="sqrt"){
        return `<span class="math-sqrt"><span class="radical">√</span><span class="radicand">${arg}</span></span>`;
      }
      if(n.n==="frac"){
        const top=a[0]?mast(a[0]):`<span class="math-atom">&nbsp;</span>`;
        const bottom=a[1]?mast(a[1]):`<span class="math-atom">&nbsp;</span>`;
        return `<span class="math-frac"><span class="top">${top}</span><span class="bar"></span><span class="bottom">${bottom}</span></span>`;
      }

      if(n.n==="cbrt"){
        return `<span class="math-root"><span class="index">3</span><span class="math-sqrt"><span class="radical">√</span><span class="radicand">${arg}</span></span></span>`;
      }

      if(n.n==="nroot"){
        const idx=a[0]?mast(a[0]):`<span class="math-atom">&nbsp;</span>`;
        const rad=a[1]?mast(a[1]):`<span class="math-atom">&nbsp;</span>`;
        return `<span class="math-root"><span class="index">${idx}</span><span class="math-sqrt"><span class="radical">√</span><span class="radicand">${rad}</span></span></span>`;
      }

      if(n.n==="Abs"){
        return `<span class="math-line"><span>|</span>${arg}<span>|</span></span>`;
      }

      if(n.n==="logb"){
        const base=a[0]?mast(a[0]):`<span class="math-atom">&nbsp;</span>`;
        const val=a[1]?mast(a[1]):`<span class="math-atom">&nbsp;</span>`;

        return `<span class="math-line"><span class="math-sub"><span>log</span><sub>${base}</sub></span>${val}</span>`;
      }

      const names={
        asin:"sin",acos:"cos",atan:"tan",
        asinh:"sinh",acosh:"cosh",atanh:"tanh"
      };

      const inv=["asin","acos","atan","asinh","acosh","atanh"].includes(n.n);
      const shown=names[n.n]||n.n;

      const fname=inv
        ? `<span class="math-power"><span class="math-base">${mh(shown)}</span><sup>−1</sup></span>`
        : `<span class="math-atom">${mh(shown)}</span>`;

      const args=a.map(mast).join(`<span class="math-op">,</span>`);

      return `<span class="math-line">${fname}<span>(</span>${args}${n.closed?'<span>)</span>':''}</span>`;
    }
  }

  return "";
}

function mixedFracMath(text){
  const m=String(text).trim().match(/^(-?\d+)\s+(\d+)\/(\d+)$/);
  if(!m)return null;

  return `<span class="math-line">
    <span class="math-atom">${mh(m[1])}</span>
    <span class="math-frac">
      <span class="top">${mh(m[2])}</span>
      <span class="bar"></span>
      <span class="bottom">${mh(m[3])}</span>
    </span>
  </span>`;
}

function mathMarkup(text){
  text=String(text??"").trim();
  if(!text)return "";

  const mixed=mixedFracMath(text);
  if(mixed)return mixed;

  try{
    return mast(parsePretty(text));
  }catch{
    return null;
  }
}

function naturalEnabled(forResult=false){
  if(state.mode==="STAT")return false;
  if(state.io!=="MthIO")return false;
  if(forResult && state.output==="LineO")return false;
  return true;
}

function setMath(el,text,forResult=false,showCursor=false){
  text=String(text??"");

  if(!naturalEnabled(forResult)){
    el.classList.add("linear");
    el.textContent=text+(showCursor?"▏":"");
    return;
  }

  el.classList.remove("linear");

  const body=mathMarkup(text);

  if(body===null){
    el.textContent=text+(showCursor?"▏":"");
    return;
  }

  el.innerHTML=
    `<span class="math-line">${body}${showCursor?'<span class="math-cursor"></span>':''}</span>`;
}
function fracTemplateMarkup(t){
  const prefix=t.prefix ? (mathMarkup(t.prefix)||mh(t.prefix)) : "";
  const suffix=t.suffix ? (mathMarkup(t.suffix)||mh(t.suffix)) : "";

  if(t.kind==="mixed"){
    const whole=t.whole?(mathMarkup(t.whole)||mh(t.whole)):"";
    const num=t.num?(mathMarkup(t.num)||mh(t.num)):"";
    const den=t.den?(mathMarkup(t.den)||mh(t.den)):"";
    const wc="slot-box"+(t.part==="whole"?" active":"");
    const nc="casio-frac-num"+(t.part==="num"?" active":"")+(!t.num?" empty":"");
    const dc="casio-frac-den"+(t.part==="den"?" active":"")+(!t.den?" empty":"");
    return `<span class="mixed-template">${prefix}<span class="${wc}">${whole||"&nbsp;"}</span><span class="casio-frac"><span class="${nc}">${num}</span><span class="casio-frac-bar"></span><span class="${dc}">${den}</span></span>${suffix}</span>`;
  }

  const numBody=t.num ? (mathMarkup(t.num)||mh(t.num)) : "";
  const denBody=t.den ? (mathMarkup(t.den)||mh(t.den)) : "";

  const numClass="casio-frac-num"+(t.part==="num" ? " active" : "")+(!t.num ? " empty" : "");
  const denClass="casio-frac-den"+(t.part==="den" ? " active" : "")+(!t.den ? " empty" : "");

  return `<span class="casio-frac-line">${prefix}<span class="casio-frac" aria-label="fraction"><span class="${numClass}">${numBody}</span><span class="casio-frac-bar"></span><span class="${denClass}">${denBody}</span></span>${suffix}</span>`;
}
function previousNaturalAtom(prefix){
  /*
    Pull the expression immediately to the left of the cursor into the
    numerator when the fraction key is pressed after a value.

    Examples:
      2 [FRAC]        -> numerator 2, cursor in denominator
      Ans [FRAC]      -> numerator Ans
      (1+2) [FRAC]    -> numerator (1+2)
      1+2 [FRAC]      -> keeps "1+" as prefix, numerator 2
  */
  if(!prefix) return null;

  let i=prefix.length-1;

  // Skip spaces.
  while(i>=0 && /\s/.test(prefix[i])) i--;
  if(i<0) return null;

  // A parenthesized expression immediately before the cursor.
  if(prefix[i] === ")"){
    let depth=1;
    let j=i-1;

    while(j>=0){
      if(prefix[j] === ")") depth++;
      else if(prefix[j] === "("){
        depth--;
        if(depth===0) break;
      }
      j--;
    }

    if(j>=0){
      // Include a function name immediately before the opening parenthesis.
      let k=j-1;
      while(k>=0 && /[A-Za-z0-9#]/.test(prefix[k])) k--;
      if(k<j-1) j=k+1;

      return {
        before: prefix.slice(0,j),
        atom: prefix.slice(j,i+1)
      };
    }
  }

  // Number / variable / Ans / PreAns / pi / postfix expression.
  let j=i;

  // Include postfix powers typed linearly, e.g. 2^3 or Ans^-1.
  while(j>=0 && /[A-Za-z0-9.#π!%+\-−^]/.test(prefix[j])) j--;

  const atom=prefix.slice(j+1,i+1);

  if(
    atom &&
    /(?:\d|Ans|PreAns|[A-FXYM]|π|\!|%|\^[-−]?\d+)$/.test(atom)
  ){
    return {
      before: prefix.slice(0,j+1),
      atom
    };
  }

  return null;
}


function slotTemplateMarkup(t){
  const p=t.prefix ? (mathMarkup(t.prefix)||mh(t.prefix)) : "";
  const s=t.suffix ? (mathMarkup(t.suffix)||mh(t.suffix)) : "";
  const a=t.a ? (mathMarkup(t.a)||mh(t.a)) : "&nbsp;";
  const b=t.b ? (mathMarkup(t.b)||mh(t.b)) : "&nbsp;";
  const ca="slot-box"+(t.part==="a"?" active":"");
  const cb="slot-box"+(t.part==="b"?" active":"");

  if(t.kind==="logbase"){
    return `<span class="slot-wrap">${p}<span>log</span><sub><span class="${ca}">${a}</span></sub><span class="${cb}">${b}</span>${s}</span>`;
  }
  if(t.kind==="nroot"){
    return `<span class="slot-wrap">${p}<span class="math-root"><span class="index"><span class="${ca}">${a}</span></span><span class="math-sqrt"><span class="radical">√</span><span class="radicand"><span class="${cb}">${b}</span></span></span></span>${s}</span>`;
  }
  return "";
}
function startSlotTemplate(kind, previousAsA=false){
  startFreshIfNeeded("TEXT");
  const left=state.expr.slice(0,state.cursor), right=state.expr.slice(state.cursor);
  let prefix=left,a="",part="a";
  if(previousAsA){
    const prev=previousNaturalAtom(left);
    if(prev){prefix=prev.before;a=prev.atom;part="b";}
  }
  state.slotTemplate={kind,prefix,suffix:right,a,b:"",part};
  render();
}
function slotAppend(t){
  const q=state.slotTemplate;if(!q)return;
  q[q.part]+=t;render();
}
function slotFinalize(){
  const q=state.slotTemplate;if(!q||!q.a.trim()||!q.b.trim())return false;
  const ins=q.kind==="logbase"?`logb(${q.a},${q.b})`:`nroot(${q.a},${q.b})`;
  state.expr=q.prefix+ins+q.suffix;
  state.cursor=q.prefix.length+ins.length;
  state.slotTemplate=null;
  return true;
}
function slotKey(k){
  const q=state.slotTemplate;if(!q)return false;
  if(/^\d$/.test(k)){slotAppend(k);return true;}
  const basic={DOT:".",NEG:"-",PLUS:"+",MINUS:"-",MUL:"×",DIV:"÷",LP:"(",RP:")",POWER:"^",EXP:"×10^"};
  if(basic[k]){slotAppend(basic[k]);return true;}
  if(k==="ANS"){slotAppend("Ans");return true;}
  if(k==="DEL"){q[q.part]=q[q.part].slice(0,-1);render();return true;}
  if(k==="AC"){state.slotTemplate=null;resetExpression();state.resultText="0";render();return true;}
  if(k==="EQ"){if(slotFinalize())calculate(false);else error("Syntax ERROR");return true;}
  return false;
}
function startMixedFractionTemplate(){
  startFreshIfNeeded("TEXT");
  const left=state.expr.slice(0,state.cursor),right=state.expr.slice(state.cursor);
  state.template={kind:"mixed",prefix:left,suffix:right,whole:"",num:"",den:"",part:"whole"};
  render();
}

function startFractionTemplate(){
  startFreshIfNeeded("TEXT");

  const left=state.expr.slice(0,state.cursor);
  const right=state.expr.slice(state.cursor);
  const previous=previousNaturalAtom(left);

  if(previous){
    /*
      This is the real-calculator style:
      type 2, press fraction, and 2 becomes the numerator.
      The cursor immediately moves to the denominator.
    */
    state.template={
      prefix:previous.before,
      suffix:right,
      num:previous.atom,
      den:"",
      part:"den"
    };
  }else{
    /*
      Fraction key pressed before entering a numerator:
      start in the numerator; DOWN moves to denominator.
    */
    state.template={
      prefix:left,
      suffix:right,
      num:"",
      den:"",
      part:"num"
    };
  }

  render();
}
function templateAppend(t){
  const q=state.template;if(!q)return;
  q[q.part]+=t;render();
}
function templateFinalize(){
  const q=state.template;if(!q)return false;
  let ins;
  if(q.kind==="mixed"){
    if(!q.whole.trim()||!q.num.trim()||!q.den.trim())return false;
    ins=`(${q.whole})+frac(${q.num},${q.den})`;
  }else{
    if(!q.num.trim()||!q.den.trim())return false;
    ins=`frac(${q.num},${q.den})`;
  }
  state.expr=q.prefix+ins+q.suffix;
  state.cursor=q.prefix.length+ins.length;
  state.template=null;
  return true;
}
function templateKey(k){
  const q=state.template;if(!q)return false;
  if(/^\d$/.test(k)){templateAppend(k);return true;}
  const basic={DOT:".",NEG:"-",PLUS:"+",MINUS:"-",MUL:"×",DIV:"÷",LP:"(",RP:")",POWER:"^",EXP:"×10^"};
  if(basic[k]){templateAppend(basic[k]);return true;}
  const fun={SQRT:"sqrt(",SIN:"sin(",COS:"cos(",TAN:"tan(",LOG:"log(",LN:"ln(",ABS:"Abs("};
  if(fun[k]){templateAppend(fun[k]);return true;}
  if(k==="SQUARE"){templateAppend("^2");return true;}
  if(k==="CUBE"){templateAppend("^3");return true;}
  if(k==="INV"){templateAppend("^-1");return true;}
  if(k==="ANS"){templateAppend("Ans");return true;}
  if(k==="DEL"){q[q.part]=q[q.part].slice(0,-1);render();return true;}
  if(k==="AC"){state.template=null;resetExpression();state.resultText="0";render();return true;}
  if(k==="EQ"){if(templateFinalize())calculate(false);else error("Syntax ERROR");return true;}
  if(k==="FRAC")return true;
  return false;
}

function setIndicators() {
  const bits=[];
  if(state.shift)bits.push("S");
  if(state.alpha)bits.push("A");
  if(state.vars.M!==0)bits.push("M");
  if(state.pending==="STO")bits.push("STO");
  if(state.pending==="RCL")bits.push("RCL");
  if(state.mode==="STAT")bits.push("STAT");
  if(state.digitsMode==="FIX")bits.push("FIX");
  if(state.digitsMode==="SCI")bits.push("SCI");
  // D/R/G and Math are intentionally hidden per the user's display preference.
  indEl.textContent=bits.join(" ");
}

function linearDisplayText(s){
  let out=String(s??"");
  // Resolve simple internal fraction forms from the inside out.
  for(let i=0;i<8;i++){
    const next=out.replace(/frac\(([^(),]+),([^(),]+)\)/g,"$1/$2");
    if(next===out)break;
    out=next;
  }
  out=out
    .replace(/RanInt\(/g,"RanInt#(")
    .replace(/Ran\(\)/g,"Ran#")
    .replace(/ECONST/g,"e")
    .replace(/nroot\(([^(),]+),([^(),]+)\)/g,"$1√($2)")
    .replace(/cbrt\(/g,"³√(");
  return out;
}

function displayExpr() {
  if (!state.on) return "";
  if (state.menu) return state.menu.title;
  if (state.mode === "STAT" && state.statType && state.pending === "STAT_EDIT") return statEditorLine();

  a=Math.round(a);b=Math.round(b);
  if(a>=b||Math.abs(a)>=1e10||Math.abs(b)>=1e10||(b-a)>=1e10)calcArgError();
  return Math.floor(Math.random()*(b-a+1))+a;
}
function realRan(){
  // Casio Ran# is a three-digit pseudo-random value in [0,1).
  return Math.floor(Math.random()*1000)/1000;
}
function realRnd(x){return rndCasio(x);}

function lexicalNormalize(s){
  s=String(s);
  s=s.replace(/(-?\d+(?:\.\d+)?)°(\d+(?:\.\d+)?)′(\d+(?:\.\d+)?)″/g,"dmsDecimal($1,$2,$3)");
  s=s.replace(/(-?\d+(?:\.\d+)?)°(\d+(?:\.\d+)?)′/g,"dmsDecimal($1,$2,0)");
  s=s.replace(/(-?\d+(?:\.\d+)?)°/g,"dmsDecimal($1,0,0)");
  s=s.replaceAll("×","*").replaceAll("÷","/").replaceAll("−","-");
  s=s.replaceAll("π","PI");
  s=s.replace(/\bAns\b/g,"ANS").replace(/\bPreAns\b/g,"PREANS");
  s=s.replace(/×10\^/g,"*10^");
  return s;
}

function calcTokenize(src){
  const s=lexicalNormalize(src);
  const out=[];let i=0;
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){i++;continue;}
    if(/[0-9.]/.test(c)){
      let j=i, dots=0;
      while(j<s.length && /[0-9.]/.test(s[j])){if(s[j]===".")dots++;j++;}
      if(dots>1)calcSyntaxError(i);
      // scientific E notation typed by display/history is accepted internally
      if(/[eE]/.test(s[j]||"")){
        let k=j+1;if(/[+-]/.test(s[k]||""))k++;
        let ds=k;while(k<s.length&&/\d/.test(s[k]))k++;
        if(k>ds)j=k;
      }
      const v=Number(s.slice(i,j));if(!Number.isFinite(v))calcSyntaxError(i);
      out.push({t:"num",v,pos:i});i=j;continue;
    }
    if(/[A-Za-z_]/.test(c)){
      let j=i+1;
      while(j<s.length && /[A-Za-z0-9_#]/.test(s[j]))j++;
      out.push({t:"id",v:s.slice(i,j),pos:i});i=j;continue;
    }
    if("+-*/^(),!%:".includes(c)){out.push({t:c,v:c,pos:i});i++;continue;}
    calcSyntaxError(i);
  }
  out.push({t:"eof",v:"",pos:s.length});
  return out;
}


function checkExpressionStack(src){
  let depth=0,maxDepth=0,commands=0,values=0;
  const s=String(src);
  for(const ch of s){
    if(ch==="("){depth++;maxDepth=Math.max(maxDepth,depth);commands++;}
    else if(ch===")")depth=Math.max(0,depth-1);
    else if("+-×÷*/^".includes(ch))commands++;
  }
  values=(s.match(/(?:\d+(?:\.\d+)?|Ans|PreAns|[A-FXYM]|π)/g)||[]).length;

  // The exact proprietary stack layout is undocumented in this guide.
  // These thresholds deliberately catch only clearly over-complex expressions.
  if(maxDepth>24 || commands>48 || values>32){
    const e=new Error("Stack ERROR");e.calcType="Stack ERROR";throw e;
  }
}

function calcEvaluateExpression(src,overrides={}){

        const r=Math.hypot(args[0],args[1]);
        if(!Number.isFinite(r) || r>Math.sqrt(lim))calcMathError();

        if(Math.abs(th)>=tlim)calcMathError();
        const x=checkFinite(r*Math.cos(toRad(th)));

        state.lastPolRec={kind:"Rec",a:x,b:y};

      }

  }

        if(peek().t===")")take();

  function power(){

  }
  const result=addSub();
  if(peek().t!=="eof")calcSyntaxError(peek().pos);
  return result;
}

function splitStatements(src){
  const out=[];let depth=0,start=0;
  for(let i=0;i<src.length;i++){
    const c=src[i];
    if(c==="(")depth++;
    else if(c===")")depth=Math.max(0,depth-1);
    else if(c===":"&&depth===0){out.push(src.slice(start,i));start=i+1;}
  }
  out.push(src.slice(start));
  return out;
}

function evaluate(s, overrides={}) {
  if(!String(s).trim())return state.ans;
  // Only the final statement is returned here; calculate() manages sequential display.
  const statements=splitStatements(String(s));
  let out=state.ans;
  for(const part of statements){
    if(!part.trim())calcSyntaxError(0);
    out=calcEvaluateExpression(part,overrides);
  }
  return out;
}
function formatNumber(n) {
  if (!Number.isFinite(n)) return "Math ERROR";
  if (Object.is(n,-0)) n=0;
  let out;
  const a=Math.abs(n);
  if (state.digitsMode==="FIX") out=n.toFixed(state.digits);
  else if (state.digitsMode==="SCI") out=n.toExponential(Math.max(0,state.digits-1)).replace("e+","×10^").replace("e","×10^");
  else {
    const lower=state.norm===1?1e-2:1e-9;
    if ((a!==0 && a<lower)||a>=1e10) out=n.toExponential(9).replace(/\.?0+e/,"e").replace("e+","×10^").replace("e","×10^");
    else out=Number(n.toPrecision(10)).toString();
  }
  if (state.decimalComma) out=out.replace(".",",");
  return out;
}

function fractionApprox(x) {
  if (!Number.isFinite(x)) return formatNumber(x);
  const sign=x<0?"-":""; x=Math.abs(x);
  let n0=Math.floor(x), frac=x-n0;
  if(frac<1e-12) return sign+n0;
  let h1=1,h0=0,k1=0,k0=1,b=frac,iter=0;
  while(iter++<30){
    const a=Math.floor(b), h2=a*h1+h0, k2=a*k1+k0;
    if(k2>999999) break;
    h0=h1; h1=h2; k0=k1; k1=k2;
    const r=b-a; if(r<1e-12) break; b=1/r;
  }
  const num=n0*k1+h1, den=k1;
  if(state.fractionStyle==="a b/c" && n0>0){
    const mixedText=sign+n0+" "+h1+"/"+den;
    const count=(String(n0)+String(h1)+String(den)).length+2;
    if(count<=10)return mixedText;
  }
  return sign+num+"/"+den;
}


function rationalNear(x,maxD=10000){
  let bestN=Math.round(x),bestD=1,bestE=Math.abs(x-bestN);
  for(let d=1;d<=maxD;d++){
    const n=Math.round(x*d),e=Math.abs(x-n/d);
    if(e<bestE){bestN=n;bestD=d;bestE=e;}
    if(e<1e-12)break;
  }
  return bestE<1e-10?{n:bestN,d:bestD}:null;
}
function simplifySqrtInt(n){
  if(n<0||n%1)return null;
  let a=1,b=n;
  for(let k=Math.floor(Math.sqrt(n));k>=2;k--){
    const sq=k*k;
    if(n%sq===0){a=k;b=n/sq;break;}
  }
  if(b===1)return String(a);
  return (a===1?"":String(a))+"sqrt("+b+")";
}

function rgcd(a,b){
  a=Math.abs(Math.trunc(a));b=Math.abs(Math.trunc(b));
  while(b){const t=a%b;a=b;b=t;}return a||1;
}
function rnorm(n,d=1){
  if(!Number.isFinite(n)||!Number.isFinite(d)||d===0)return null;
  if(Math.abs(n-Math.round(n))>1e-12||Math.abs(d-Math.round(d))>1e-12)return null;
  n=Math.round(n);d=Math.round(d);
  if(d<0){n=-n;d=-d;}
  const g=rgcd(n,d);return {n:n/g,d:d/g};
}
function radd(a,b){return rnorm(a.n*b.d+b.n*a.d,a.d*b.d);}
function rneg(a){return {n:-a.n,d:a.d};}
function rmul(a,b){return rnorm(a.n*b.n,a.d*b.d);}
function rdiv(a,b){if(!b||b.n===0)return null;return rnorm(a.n*b.d,a.d*b.n);}
function sqfree(n){
  n=Math.abs(Math.round(n));
  if(n===0)return {out:0,rad:1};
  let out=1,rad=n;
  for(let k=2;k*k<=rad;k++){
    const q=k*k;
    while(rad%q===0){rad/=q;out*=k;}
  }
  return {out,rad};
}
function snew(){return new Map();}
function sclone(a){return new Map([...a].map(([k,v])=>[k,{n:v.n,d:v.d}]));}
function sadd(a,b,sgn=1){
  const z=sclone(a);
  for(const [r,c0] of b){
    const c=sgn===1?c0:rneg(c0);
    const old=z.get(r)||{n:0,d:1};
    const nu=radd(old,c);
    if(!nu||nu.n===0)z.delete(r);else z.set(r,nu);
  }
  return z;
}
function snum(n,d=1){
  const q=rnorm(n,d);if(!q)return null;
  const z=snew();if(q.n!==0)z.set(1,q);return z;
}
function smul(a,b){
  const z=snew();
  for(const [ra,ca] of a)for(const [rb,cb] of b){
    const sf=sqfree(ra*rb);
    let c=rmul(ca,cb);if(!c)return null;
    c=rmul(c,{n:sf.out,d:1});if(!c)return null;
    const old=z.get(sf.rad)||{n:0,d:1};
    const nu=radd(old,c);if(!nu)return null;
    if(nu.n===0)z.delete(sf.rad);else z.set(sf.rad,nu);
  }
  return z;
}
function sdiv(a,b){
  if(b.size!==1)return null;
  const [[r,c]]=b;
  if(c.n===0)return null;
  if(r===1){
    const z=snew();
    for(const [ra,ca] of a){const q=rdiv(ca,c);if(!q)return null;z.set(ra,q);}
    return z;
  }
  const root=snew();root.set(r,{n:1,d:1});
  const top=smul(a,root);if(!top)return null;
  const denom=rmul(c,{n:r,d:1});if(!denom)return null;
  const z=snew();
  for(const [ra,ca] of top){const q=rdiv(ca,denom);if(!q)return null;z.set(ra,q);}

}
function spow(a,n){

  n=Math.round(n);

  if(n<0){const p=spow(a,-n);return p?sdiv(snum(1),p):null;}
  let z=snum(1),b=a;
  while(n>0){
    if(n&1){z=smul(z,b);if(!z)return null;}
    n>>=1;
    if(n){b=smul(b,b);if(!b)return null;}
  }
  return z;
}
function srational(a){
  if(a.size===0)return {n:0,d:1};

  return a.get(1);

function ssqrt(a){
  const q=srational(a);if(!q||q.n<0)return null;
  if(q.n===0)return snum(0);

function surdExact(src){
  const raw=String(src);
  if(/[.]/.test(raw))return null;

  try{ts=calcTokenize(raw);}catch{return null;}
  let p=0;const peek=()=>ts[p],take=()=>ts[p++];

  function primary(){
    const t=peek();
    if(t.t==="num"){
      take();
      if(Math.abs(t.v-Math.round(t.v))>1e-12)return null;
      return snum(Math.round(t.v));
    }
    if(t.t==="("){
      take();const v=add();if(!v)return null;
      if(peek().t===")")take();else if(peek().t!=="eof")return null;
      return v;
    }
    if(t.t==="id"){
      take();
      if(peek().t!=="(")return null;
      take();const args=[];
      if(peek().t!==")"&&peek().t!=="eof"){
        args.push(add());
        while(peek().t===","){take();args.push(add());}
      }

  return z;
}
function surdDisplayAllowed(z){
  if(!z)return false;
  const terms=[...z.entries()].filter(([,c])=>c&&c.n!==0);
  if(terms.length>2)return false;

  for(const [rad,c] of terms){
    if(rad===1){
      if(Math.abs(c.n)>=10000 || c.d>=100)return false;
      continue;
    }
    if(rad<=1||rad>=1000)return false;
    if(Math.abs(c.n)>=100||c.d>=100)return false;
  }
  return true;
}
function surdText(z){
  if(!z||z.size===0)return "0";
  if(!surdDisplayAllowed(z))return null;
  const pieces=[];
  for(const [rad,c] of z){
    if(c.n===0)continue;
    const neg=c.n<0,an=Math.abs(c.n),d=c.d;
    let body;
    if(rad===1){
      body=d===1?String(an):`frac(${an},${d})`;
    }else{
      const root=`sqrt(${rad})`;
      if(d===1)body=an===1?root:`${an}${root}`;
      else{
        const top=an===1?root:`${an}${root}`;
        body=`frac(${top},${d})`;
      }
    }
    pieces.push({neg,body});
  }
  if(!pieces.length)return "0";
  let out="";
  pieces.forEach((t,i)=>{
    if(i===0)out+=(t.neg?"-":"")+t.body;
    else out+=(t.neg?"-":"+")+t.body;
  });
  return out;
}


function exactTrigText(src,val,allowSurd=true){
  const s=String(src).replace(/\s+/g,"");
  if(!/^(?:sin|cos|tan)\(/.test(s))return null;
  const sign=val<0?"-":"";
  const a=Math.abs(val);
  const close=(x,y)=>Math.abs(x-y)<1e-12;

  if(close(a,0))return "0";
  if(close(a,1))return sign+"1";
  if(close(a,0.5))return sign+"frac(1,2)";

  if(allowSurd){
    if(close(a,Math.SQRT2/2))return sign+"frac(sqrt(2),2)";
    if(close(a,Math.sqrt(3)/2))return sign+"frac(sqrt(3),2)";
    if(close(a,Math.sqrt(3)))return sign+"sqrt(3)";
    if(close(a,1/Math.sqrt(3)))return sign+"frac(sqrt(3),3)";
  }
  return null;
}

function exactNaturalText(src,val,opts={}){
  const s=String(src).replace(/\s+/g,"");
  const trigExact=exactTrigText(src,val,opts.allowSurd!==false);
  if(trigExact)return trigExact;
  if(opts.allowSurd!==false){
    const sz=surdExact(src);
    if(sz){
      const st=surdText(sz);
      if(st && st.includes("sqrt("))return st;
    }
  }
  let m=s.match(/^sqrt\((\d+)\)?$/);
  if(m){
    const t=simplifySqrtInt(Number(m[1]));
    if(t)return t;
  }
  m=s.match(/^cbrt\(([-]?\d+)\)?$/);
  if(m){
    const n=Number(m[1]),r=Math.round(Math.cbrt(n));
    if(r*r*r===n)return String(r);
  }
  m=s.match(/^nroot\(([-]?\d+),([-]?\d+)\)?$/);
  if(m){
    const n=Number(m[1]),x=Number(m[2]);
    const r=x<0?-Math.round(Math.pow(-x,1/n)):Math.round(Math.pow(x,1/n));
    if(Number.isFinite(r) && Math.abs((r**n)-x)<1e-10)return String(r);
  }

  if(Math.abs(val)<1e6 && s.includes("π") && /^[0-9π+\-−×÷*/().^]+$/.test(s)){
    const q=val/3.14159265358980, r=rationalNear(q);
    if(r){
      if(r.n===0)return "0";
      const sign=r.n<0?"-":"";
      const an=Math.abs(r.n);
      if(r.d===1)return sign+(an===1?"":an)+"π";
      return sign+(an===1?"1":an)+"/"+r.d+"π";
    }
  }
  if(/^[\s\d+\-−×÷*/().,]+$/.test(String(src).replace(/frac/g,""))){
    return fractionApprox(val);
  }
  return null;
}

function exactAlternative(src,val,decimalForced=false){
  if(/\bRan\(\)/.test(src))return fractionApprox(val);
  const alt=exactNaturalText(src,val,{allowSurd:!decimalForced});
  if(decimalForced && alt && alt.includes("sqrt("))return null;
  return alt;
}
function formatDefaultResult(src,val,decimalForced=false){
  const exact=exactAlternative(src,val,decimalForced);
  state.lastExactText=exact;

  // MathO normally shows an exact fraction / surd / pi form when one is available.
  // SHIFT+= explicitly requests decimal output.
  const showExact=!decimalForced && state.io==="MthIO" && state.output==="MathO" && !!exact;
  state.exactMode=showExact;
  return showExact ? exact : formatNumber(val);
}
function calculate(decimalForced=false) {
  if(state.mode!=="COMP" && state.mode!=="STAT")return;
  state.forcedDecimal=!!decimalForced;

  // Continue a previously-entered multi-statement on repeated equals.
  if(state.multiQueue.length && state.multiIndex>=0 && state.multiIndex<state.multiQueue.length-1 && state.showingResult){
    state.multiIndex++;
    const src=state.multiQueue[state.multiIndex];
    try{
      state.lastPolRec=null;
      const val=calcEvaluateExpression(src,{});
      if(state.mode==="COMP")state.preAns=state.ans;
      state.ans=val;
      state.lastExpr=src;state.expr=src;state.cursor=src.length;
      state.resultText=formatDefaultResult(src,val,decimalForced);
      state.secondaryText=state.multiIndex<state.multiQueue.length-1?"Disp":"";
      if(state.lastPolRec){
        if(state.lastPolRec.kind==="Pol"){
          state.resultText="r="+formatNumber(state.lastPolRec.a);
          state.secondaryText="θ="+formatNumber(state.lastPolRec.b);
        }else{
          state.resultText="X="+formatNumber(state.lastPolRec.a);
          state.secondaryText="Y="+formatNumber(state.lastPolRec.b);
        }
      }
      state.showingResult=true;state.error=null;render();return;
    }catch(e){return showCalcError(e,src);}
  }

  const whole=state.expr.trim() || (state.lastExpr || "Ans");
  const statements=splitStatements(whole).filter(x=>x.trim()!=="");
  if(!statements.length)return;

  state.multiQueue=statements;
  state.multiIndex=0;
  const src=statements[0];

  try{
    state.lastPolRec=null;
    const val=calcEvaluateExpression(src,{});
    if(state.mode==="COMP")state.preAns=state.ans;
    state.ans=val;
    state.lastExpr=whole;
    if(state.mode==="COMP"){
      state.history.push({expr:whole,value:val,text:formatNumber(val)});
      while(state.history.reduce((a,h)=>a+h.expr.length+12,0)>200)state.history.shift();
      state.historyIndex=-1;
    }
    state.showingResult=true;
    state.expr=whole;state.cursor=whole.length;
    state.error=null;state.dmsView=false;state.primeView=false;state.engShift=0;
    state.secondaryText=statements.length>1?"Disp":"";

    // Any sexagesimal input displays a sexagesimal result for arithmetic.
    if(/[°′″]/.test(src)){
      const dms=decimalToDms(val);
      if(dms===null)calcMathError();
      state.resultText=dms;
      state.lastExactText=null;
      state.exactMode=false;
      state.dmsView=true;
    }else{
      state.resultText=formatDefaultResult(src,val,decimalForced);
    }

    if(state.mode==="COMP" && state.history.length){
      state.history[state.history.length-1].text=state.resultText;
    }

    if(state.lastPolRec){
      if(state.lastPolRec.kind==="Pol"){
        state.resultText="r="+formatNumber(state.lastPolRec.a);
        state.secondaryText="θ="+formatNumber(state.lastPolRec.b);
      }else{
        state.resultText="X="+formatNumber(state.lastPolRec.a);
        state.secondaryText="Y="+formatNumber(state.lastPolRec.b);
      }
      state.lastResultKind="pair";
      if(state.mode==="COMP" && state.history.length){
        state.history[state.history.length-1].text=state.resultText;
      }
    }else state.lastResultKind="number";

    render();
  }catch(e){
    showCalcError(e,whole);
  }
}

function showCalcError(e,src){
  const typ=e.calcType||e.message||"Syntax ERROR";
  state.error=["Math ERROR","Syntax ERROR","Argument ERROR","Stack ERROR","Insufficient MEM"].includes(typ)?typ:"Syntax ERROR";
  state.resultText=state.error;
  state.secondaryText="";
  state.showingResult=true;
  state.errorExpr=src;
  state.errorPos=Number.isFinite(e.pos)?e.pos:Math.min(state.cursor,src.length);
  render();
}
function toggleSD() {
  if(!state.showingResult||state.error||state.lastResultKind==="pair"||state.dmsView)return;

  if(state.exactMode){
    state.exactMode=false;
    state.resultText=formatNumber(state.ans);
    state.secondaryText="";
    render();
    return;
  }

  // Only convert when the evaluated expression has a genuine exact alternative.
  if(!state.lastExactText)return;
  state.exactMode=true;
  state.resultText=state.lastExactText;
  state.secondaryText="";
  render();
}
function factorResult() {
  // FACT is valid only for a displayed positive-integer COMP result up to 10 digits.
  if(
    state.mode!=="COMP" ||
    !state.showingResult ||
    state.lastResultKind==="pair" ||
    !Number.isFinite(state.ans) ||
    state.ans<=0 ||
    Math.abs(state.ans-Math.round(state.ans))>1e-12 ||
    state.ans>9999999999 ||
    !/^-?\d+$/.test(String(state.resultText).trim())
  ){
    return error("Math ERROR");
  }

  let n=Math.round(state.ans),p=2,parts=[];
  while(p*p<=n && p<=997){
    let c=0;
    while(n%p===0){n/=p;c++;}
    if(c)parts.push(String(p)+(c>1?"^"+c:""));
    p=p===2?3:p+2;
  }
  if(n>1)parts.push(n<=997?String(n):"("+String(n)+")");
  state.resultText=parts.join("×")||String(state.ans);
  state.secondaryText="";
  state.primeView=true;
  render();
}
function error(msg){
  state.error=msg;state.resultText=msg;state.secondaryText="";
  state.errorExpr=state.expr;state.errorPos=state.cursor;state.showingResult=true;render();
}

function handleMenuDigit(k){
  const n=Number(k); if(!state.menu || !Number.isFinite(n)) return false;
  const a=state.menu.action, page=state.menuPage;

  if(a==="MODE"){
    const leavingStat=state.mode==="STAT" && n!==2;
    if(leavingStat){state.statRows=[];state.statType=null;state.pending=null;}
    if(n===1){
      state.mode="COMP";state.preAns=0;state.history=[];state.menu=null;resetExpression();render("0");
    }
    else if(n===2){
      state.mode="STAT";state.io="LineIO";state.output="LineO";
      state.preAns=0;state.history=[];state.statRows=[];state.statType=null;state.menu=null;statTypeMenu();
    }
    else if(n===3){
      state.mode="TABLE";state.preAns=0;state.history=[];state.menu=null;startTable();
    }
    return true;
  }
  if(a==="CLR"){
    if(n>=1&&n<=3){
      state.confirmAction=n===1?"CLR_SETUP":n===2?"CLR_MEMORY":"CLR_ALL";
      showMenu("Clear?",["= : Yes   AC : Cancel"],"","CONFIRM");
    }
    return true;
  }
  if(a==="DRG"){
    state.menu=null;
    if(n===1)applyAngleSuffix("degUnit");
    if(n===2)applyAngleSuffix("radUnit");
    if(n===3)applyAngleSuffix("graUnit");
    return true;
  }
  if(a==="HYP"){
    const funcs=["sinh","cosh","tanh","asinh","acosh","atanh"];
    if(n>=1&&n<=6){state.menu=null;insertText(funcs[n-1]+"(");}
    return true;
  }
  if(a==="STATTYPE"){
    if(n>=1&&n<=8){
      const wasSingle=state.statType===1;
      const willSingle=n===1;
      if(state.statType!==null && wasSingle!==willSingle)state.statRows=[];
      state.statType=n;state.menu=null;state.pending="STAT_EDIT";
      state.statCell={row:0,col:0};state.statEntry="";render();
    }
    return true;
  }
  if(a==="STATEDITORMAIN"){
    if(n===1){state.menu=null;statTypeMenu();return true;}
    if(n===2){state.menu=null;state.pending="STAT_EDIT";render();return true;}
    if(n===3){showMenu("STAT Edit",["1:Ins  2:Del-A"],"","STATEDIT");return true;}
    return true;
  }
  if(a==="STATCALCMAIN"){
    if(n===1){state.menu=null;statTypeMenu();return true;}
    if(n===2){state.menu=null;state.pending="STAT_EDIT";render();return true;}
    if(n===3){showStatValueMenu("SUM");return true;}
    if(n===4){showStatValueMenu("VAR");return true;}
    if(state.statType===1&&n===5){showStatValueMenu("MINMAX");return true;}
    if(state.statType!==1&&n===5){showStatValueMenu("REG");return true;}
    if(state.statType!==1&&n===6){showStatValueMenu("MINMAX");return true;}
    return true;
  }
  if(a==="STATEDIT"){
    if(n===1){state.statRows.splice(state.statCell.row,0,[]);state.menu=null;state.pending="STAT_EDIT";render();}
    if(n===2){state.statRows=[];state.statCell={row:0,col:0};state.menu=null;state.pending="STAT_EDIT";render();}
    return true;
  }
  if(a==="STATRESULT"){
    const line=(state.menu.lines||[]).find(x=>String(x).trim().startsWith(String(n)+":"));
    if(line){
      const m=String(line).match(/\s(-?\d+(?:\.\d+)?(?:×10\^-?\d+)?)$/);
      state.menu=null;state.pending=null;
      if(m){state.resultText=m[1];state.showingResult=true;render();}
      else render();
    }
    return true;
  }
  if(a==="SETUP"){
    if(page===0 && (n===1||n===2)){
      if(n===1){showMenu("MthIO",["1:MathO  2:LineO"],"Natural input display","MTHIOSELECT");}
      else {
      state.io="LineIO";state.output="LineO";state.history=[];
      if(state.mode==="TABLE"){state.table.f="";state.table.g="";state.tableStage="F";state.tableEntry="";}
      closeMenu();
    }
      return true;
    }
    if(page===1 && n>=3&&n<=5){
      state.angle=n===3?"DEG":n===4?"RAD":"GRAD";state.primeView=false;closeMenu();return true;
    }
    if(page===2 && n>=6&&n<=8){
      if(n===8){showMenu("Norm",["1:Norm 1  2:Norm 2"],"Press 1 or 2","NORMSELECT");}
      else {state.primeView=false;state.pending=n===6?"FIXDIG":"SCIDIG";state.menu=null;state.resultText=(n===6?"Fix 0–9?":"Sci 1–10?");render();}
      return true;
    }
    if(page===3&&(n===1||n===2)){state.fractionStyle=n===1?"a b/c":"d/c";closeMenu();return true;}
    if(page===4&&n===3){showMenu("STAT",["1:ON  2:OFF"],"Frequency column","STATFREQ");return true;}
    if(page===4&&n===4){showMenu("TABLE",["1:f(x)  2:f(x),g(x)"],"Number of functions","TABLESET");return true;}
    if(page===5&&n===5){showMenu("Disp",["1:Dot  2:Comma"],"Decimal symbol","DISP");return true;}
    if(page===5&&n===6){showMenu("APO",["1:10 Min.  2:60 Min."],"Auto Power Off","APO");return true;}
    if(page===5&&n===7){state.menu=null;state.pending="CONTRAST";state.resultText="CONT";render();return true;}
    return true;
  }
  if(a==="MTHIOSELECT"){
    if(n===1||n===2){
      state.io="MthIO";state.output=n===1?"MathO":"LineO";state.history=[];state.overwrite=false;
      if(state.mode==="TABLE"){state.table.f="";state.table.g="";state.tableStage="F";state.tableEntry="";}
      closeMenu();
    }
    return true;
  }
  if(a==="NORMSELECT"){if(n===1||n===2){state.primeView=false;state.digitsMode="NORM";state.norm=n;closeMenu();}return true;}
  if(a==="STATFREQ"){
    if(n===1||n===2){
      const nv=n===1;
      if(nv!==state.statFreq){state.statRows=[];state.statCell={row:0,col:0};}
      state.statFreq=nv;closeMenu();
    }
    return true;
  }
  if(a==="TABLESET"){if(n===1||n===2){state.tableTwo=n===2;closeMenu();}return true;}
  if(a==="DISP"){if(n===1||n===2){state.decimalComma=n===2;closeMenu();}return true;}
  if(a==="APO"){if(n===1||n===2){state.apoMinutes=n===1?10:60;closeMenu();armAPO();}return true;}
  return false;
}

function alphaVariableForKey(k){
  return ({NEG:"A",DMS:"B",HYP:"C",SIN:"D",COS:"E",TAN:"F",RP:"X",SD:"Y",MPLUS:"M"})[k]||null;
}
function useVariable(v){
  if(state.pending==="STO"){
    let val;
    try{val=state.showingResult?state.ans:calcEvaluateExpression(state.expr||"Ans");}
    catch(e){return showCalcError(e,state.expr);}
    state.vars[v]=val;state.pending=null;state.resultText=formatNumber(val);state.secondaryText="";state.showingResult=true;render();return;
  }
  if(state.pending==="RCL"){
    state.pending=null;
    const val=state.vars[v];
    state.resultText=formatNumber(val);state.secondaryText="";state.showingResult=true;
    state.lastExpr=v;state.expr=v;state.cursor=1;
    render();return;
  }
  insertText(v);
}

function shifted(k){
  state.shift=false;
  switch(k){
    case "MODE":setupMenu();return true;
    case "RCL":state.pending="STO";render();return true;
    case "MPLUS":{
      let v;try{v=state.showingResult?state.ans:calcEvaluateExpression(state.expr||"Ans");}
      catch(e){return showCalcError(e,state.expr);}
      if(state.mode==="COMP")state.preAns=state.ans;
      state.ans=v;state.vars.M=checkFinite(state.vars.M-v);
      state.resultText=formatNumber(v);state.secondaryText="";state.showingResult=true;render();return true;
    }

    case "SQRT":insertText("cbrt(");return true;

    case "INV":
      if(state.showingResult){state.expr="Ans";state.cursor=3;state.showingResult=false;}
      insertText("!");return true;

    case "DMS":
      if(state.primeView){state.primeView=false;state.resultText=formatNumber(state.ans);render();return true;}
      factorResult();return true;
    case "SIN":insertText("asin(");return true;
    case "COS":insertText("acos(");return true;
    case "TAN":insertText("atan(");return true;
    case "LP":
      if(state.showingResult){state.expr="Ans";state.cursor=3;state.showingResult=false;}
      insertText("%");return true;
    case "RP":insertText(",");return true;

    case "9":clrMenu();return true;
    case "DEL":
      if(state.io==="LineIO"){state.overwrite=!state.overwrite;state.resultText=state.overwrite?"OVER":"INS";render();}
      else {state.pending="INS";render();}
      return true;
    case "AC":state.on=false;resetExpression();render();return true;

    case "MUL":wrapPreviousAsFunction("nPr");return true;
    case "DIV":wrapPreviousAsFunction("nCr");return true;
    case "PLUS":insertText("Pol(");return true;
    case "MINUS":insertText("Rec(");return true;

    case "0":insertText("Rnd(");return true;
    case "DOT":insertText("Ran()");return true;
    case "EXP":insertText("π");return true;
    case "ANS":drgMenu();return true;
    case "EQ":calculate(true);return true;
    case "ENG":eng(-1);return true;

    case "FRAC":
      if(state.io==="MthIO")startMixedFractionTemplate();
      else insertText(" a b/c ");
      return true;

    case "SD":
      if(state.showingResult && !state.error && state.lastResultKind!=="pair"){
        const current=String(state.resultText||"");
        const rational=/^-?\d+(?:\s+\d+)?\/\d+$/.test(current) ||
                       (state.lastExactText && /^-?\d+(?:\s+\d+)?\/\d+$/.test(state.lastExactText));
        if(rational && Math.abs(state.ans-Math.round(state.ans))>1e-12){
          const old=state.fractionStyle;
          const target=/\s+\d+\/\d+$/.test(current)?"d/c":"a b/c";
          state.fractionStyle=target;
          const converted=fractionApprox(state.ans);
          state.fractionStyle=old;
          state.resultText=converted;
          state.lastExactText=converted;
          state.exactMode=true;
          render();
        }
      }
      return true;

    case "POWER":startSlotTemplate("nroot",true);return true;
    case "LOG":insertText("10^(");return true;
    case "LN":insertText("ECONST^(");return true;
  }
  return false;
}
function alphaAction(k){
  state.alpha=false;
  const v=alphaVariableForKey(k);
  if(v){useVariable(v);return true;}
  if(k==="DOT"){insertText("RanInt(");return true;}
  if(k==="ANS"){
    if(state.mode==="COMP")insertText("PreAns");
    else render();
    return true;
  }
  if(k==="EXP"){insertText("ECONST");return true;}
  if(k==="ENG"){insertText(":");return true;}
  return false;
}

function currentValue(){try{return evaluate(state.expr||"Ans");}catch{return state.ans;}}
function eng(direction=1){
  const v=state.showingResult?state.ans:currentValue();
  if(!Number.isFinite(v)||v===0){state.resultText=formatNumber(v);state.showingResult=true;render();return;}

  let e;
  if(state.engShift===0){
    // First ENG press chooses the ordinary engineering exponent.
    e=Math.floor(Math.log10(Math.abs(v))/3)*3;
  }else{
    e=state.engShift;
  }

  // Normal ENG moves the decimal point to the right on successive presses,
  // i.e. exponent steps DOWN by 3. SHIFT+ENG does the reverse.
  if(state.engShift!==0)e += direction===1 ? -3 : 3;
  else if(direction===-1)e += 3;

  state.engShift=e;
  state.resultText=formatNumber(v/(10**e))+"×10^"+e;
  state.secondaryText="";state.showingResult=true;render();
}

function statExpanded(){
  const rows=state.statRows.filter(r=>r&&Number.isFinite(r[0]));
  const out=[];
  for(const r of rows){
    const f=state.statFreq?Math.max(0,Math.floor(r[statCols().length-1]||1)):1;
    for(let i=0;i<f;i++)out.push([r[0],r[1]]);
  }
  return out;
}
function linReg(xs,ys){
  const n=xs.length,mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;
  const sxx=xs.reduce((a,x)=>a+(x-mx)**2,0), syy=ys.reduce((a,y)=>a+(y-my)**2,0);
  const sxy=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0);
  const B=sxy/sxx,A=my-B*mx,r=sxy/Math.sqrt(sxx*syy);
  return {A,B,r};
}
function quadReg(xs,ys){
  const n=xs.length;
  let sx=0,sx2=0,sx3=0,sx4=0,sy=0,sxy=0,sx2y=0;
  xs.forEach((x,i)=>{const y=ys[i];sx+=x;sx2+=x*x;sx3+=x**3;sx4+=x**4;sy+=y;sxy+=x*y;sx2y+=x*x*y;});
  const M=[[n,sx,sx2],[sx,sx2,sx3],[sx2,sx3,sx4]], b=[sy,sxy,sx2y];
  for(let i=0;i<3;i++){
    let p=i;for(let j=i+1;j<3;j++)if(Math.abs(M[j][i])>Math.abs(M[p][i]))p=j;
    [M[i],M[p]]=[M[p],M[i]];[b[i],b[p]]=[b[p],b[i]];
    const d=M[i][i];if(Math.abs(d)<1e-15)return {A:NaN,B:NaN,C:NaN};
    for(let j=i;j<3;j++)M[i][j]/=d;b[i]/=d;

  }

}
function statValues(){
  const d=statExpanded();if(!d.length)throw new Error("Math ERROR");
  const xs=d.map(r=>r[0]),ys=d.map(r=>r[1]).filter(Number.isFinite),n=xs.length;
  const sx=xs.reduce((a,b)=>a+b,0), sx2=xs.reduce((a,b)=>a+b*b,0), sx3=xs.reduce((a,b)=>a+b**3,0), sx4=xs.reduce((a,b)=>a+b**4,0);

function statCols(){return state.statType===1?["X",...(state.statFreq?["FREQ"]:[])]:["X","Y",...(state.statFreq?["FREQ"]:[])];}
function statEditorLine(){const c=statCols();return c.map((x,i)=>i===state.statCell.col?"["+x+"]":x).join("  ");}
function statEditorResultLine(){
  const r=state.statCell.row,c=state.statCell.col,cols=statCols();
  const row=state.statRows[r]||[];

}
function statCapacity(){
  const cols=statCols().length;
  if(cols===1)return 80;
  if(cols===2)return 40;
  return 26;
}
function statMove(d){
  const cols=statCols();
  if(d==="LEFT")state.statCell.col=Math.max(0,state.statCell.col-1);
  if(d==="RIGHT")state.statCell.col=Math.min(cols.length-1,state.statCell.col+1);
  if(d==="UP")state.statCell.row=Math.max(0,state.statCell.row-1);
  if(d==="DOWN")state.statCell.row=Math.min(statCapacity()-1,state.statCell.row+1);
  state.statEntry="";render();
}
function statInputDigit(t){state.statEntry+=t;render();}
function statCommit(){

  if(state.statEntry===""||!Number.isFinite(v))return;
  const r=state.statCell.row,c=state.statCell.col,cols=statCols();
  if(cols[c]==="FREQ" && (v<=0 || Math.abs(v-Math.round(v))>1e-12)){return error("Math ERROR");}

function statSummary(){
  const rows=state.statRows.filter(r=>r&&Number.isFinite(r[0]));

  let xs=[];
  for(const r of rows){const f=state.statFreq?(r[statCols().length-1]||1):1;for(let i=0;i<f;i++)xs.push(r[0]);}
  const n=xs.length, mean=xs.reduce((a,b)=>a+b,0)/n;
  const pop=Math.sqrt(xs.reduce((a,x)=>a+(x-mean)**2,0)/n);
  const samp=n>1?Math.sqrt(xs.reduce((a,x)=>a+(x-mean)**2,0)/(n-1)):0;
  showMenu("STAT VAR",[
    "n="+n+"  x̄="+formatNumber(mean),
    "σx="+formatNumber(pop),
    "sx="+formatNumber(samp),
    "min="+formatNumber(Math.min(...xs))+" max="+formatNumber(Math.max(...xs))

}
function startTable(){

}

function tableEnter(){
  const e=state.tableEntry||"";
  if(state.tableStage==="F"){state.table.f=e;state.tableEntry="";state.tableStage=state.tableTwo?"G":"START";return render();}
  if(state.tableStage==="G"){state.table.g=e;state.tableEntry="";state.tableStage="START";return render();}
  const v=e===""?(state.tableStage==="START"?1:state.tableStage==="END"?5:1):Number(e);
  if(!Number.isFinite(v))return error("Syntax ERROR");
  if(state.tableStage==="START"){state.table.start=v;state.tableStage="END";}
  else if(state.tableStage==="END"){state.table.end=v;state.tableStage="STEP";}

function buildTable(){
  if(/\b(?:Pol|Rec)\s*\(/.test(state.table.f)||/\b(?:Pol|Rec)\s*\(/.test(state.table.g||"")){
    const e=new Error("Syntax ERROR");e.calcType="Syntax ERROR";return showCalcError(e,state.table.f);
  }
  const maxRows=state.tableTwo?20:30;
  const theoretical=Math.floor((state.table.end-state.table.start)/state.table.step+1e-12)+1;
  if(theoretical>maxRows){
    state.error="Insufficient MEM";state.resultText="Insufficient MEM";state.showingResult=true;render();return false;
  }
  const rows=[];
  for(let i=0;i<theoretical;i++){

    let f,g;
    try{
      f=calcEvaluateExpression(state.table.f,{X:x});
      g=state.table.g?calcEvaluateExpression(state.table.g,{X:x}):null;
    }catch(e){f=NaN;g=NaN;}

function tableViewLine(){const r=state.table.rows[state.table.index];if(!r)return "No data";return "X="+formatNumber(r.x)+"  f="+formatNumber(r.f);}

function press(k){
  armAPO();

  // Error display: left/right returns to the error position; AC clears the bad calculation.
  if(state.error){
    if(k==="AC"){
      state.error=null;state.errorExpr="";state.expr="";state.cursor=0;state.resultText="";state.secondaryText="";state.showingResult=false;render();return;
    }
    if(k==="DEL"){state.error=null;state.expr=state.errorExpr||state.expr;state.cursor=Math.max(0,state.errorPos);state.showingResult=false;deleteLeft();return;}
  }

  // Operations documented to exit prime-factor display.
  if(state.primeView && (k==="EQ"||k==="DOT"||k==="MODE")){
    state.primeView=false;state.resultText=formatNumber(state.ans);state.secondaryText="";
    if(k==="EQ"){render();return;}
  }
  if(state.slotTemplate && slotKey(k))return;
  if(state.template && templateKey(k))return;

  if(state.confirmAction){
    if(k==="EQ"){
      const a=state.confirmAction;state.confirmAction=null;state.menu=null;
      if(a==="CLR_SETUP"){
        state.history=[];state.statRows=[];state.statType=null;
        Object.assign(state,{mode:"COMP",angle:"DEG",io:"MthIO",output:"MathO",digitsMode:"NORM",digits:1,norm:2,fractionStyle:"d/c",statFreq:false,tableTwo:true,decimalComma:false,overwrite:false,apoMinutes:10});
      }else if(a==="CLR_MEMORY"){
        state.history=[];
        for(const v of Object.keys(state.vars))state.vars[v]=0;state.ans=0;state.preAns=0;
      }else if(a==="CLR_ALL"){
        for(const v of Object.keys(state.vars))state.vars[v]=0;
        state.ans=0;state.preAns=0;state.history=[];state.statRows=[];state.statType=null;
        Object.assign(state,{mode:"COMP",angle:"DEG",io:"MthIO",output:"MathO",digitsMode:"NORM",digits:1,norm:2,fractionStyle:"d/c",statFreq:false,tableTwo:true,decimalComma:false,overwrite:false,apoMinutes:10});
      }
      state.lastExactText=null;state.exactMode=true;resetExpression();armAPO();render("0");return;
    }
    if(k==="AC"){state.confirmAction=null;state.menu=null;render("0");return;}
    return;
  }

  if(state.pending==="CONTRAST"&&k==="AC"){state.pending=null;render("0");return;}
  if(handleNaturalINS(k))return;
  if(!state.on){if(k==="ON"){state.on=true;state.history=[];resetExpression();state.resultText="";render("");}return;}
  if(state.menu && /^\d$/.test(k) && handleMenuDigit(k))return;

  if(state.pending==="FIXDIG"||state.pending==="SCIDIG"){
    if(/^\d$/.test(k)){
      let n=Number(k);
      if(state.pending==="FIXDIG"){state.digitsMode="FIX";state.digits=n;}
      else {if(n===0)n=10;state.digitsMode="SCI";state.digits=n;}
      state.pending=null;render("0");return;
    }
  }

  if(state.mode==="STAT"&&state.pending==="STAT_EDIT"){
    if(k==="SHIFT"){state.shift=!state.shift;render();return;}
    if(state.shift&&k==="1"){state.shift=false;return statEditorMenu();}
    if(/^\d$/.test(k))return statInputDigit(k);
    if(k==="DOT")return statInputDigit(".");
    if(k==="NEG")return statInputDigit("-");
    if(k==="EQ")return statCommit();
    if(k==="DEL"){
      if(state.statEntry){state.statEntry=state.statEntry.slice(0,-1);}
      else state.statRows.splice(state.statCell.row,1);
      return render();
    }
    if(k==="AC"){state.pending=null;resetExpression();return render("0");}
    if(k==="MODE")return modeMenu();
    return;
  }

  if(state.mode==="STAT" && state.pending!=="STAT_EDIT" && state.shift && k==="1"){

  }

  if(state.mode==="TABLE"&&state.tableStage){

      if(k==="AC"){state.tableStage="F";state.tableEntry="";return render();}

      return;

    if(k==="SHIFT"){state.shift=!state.shift;state.alpha=false;render();return;}
    if(k==="ALPHA"){state.alpha=!state.alpha;state.shift=false;render();return;}

    const mp={DOT:".",PLUS:"+",MINUS:"-",MUL:"×",DIV:"÷",LP:"(",RP:")",POWER:"^",EXP:"×10^",SQUARE:"^2",CUBE:"^3",INV:"^-1"};
    if(mp[k]){state.tableEntry+=mp[k];return render();}
    const fn={SQRT:"sqrt(",SIN:"sin(",COS:"cos(",TAN:"tan(",LOG:"log(",LN:"ln(",ABS:"Abs("};
    if(fn[k]){state.tableEntry+=fn[k];return render();}
    if(k==="NEG"){state.tableEntry+="-";return render();}
    if(k==="EQ")return tableEnter();
    if(k==="DEL"){state.tableEntry=state.tableEntry.slice(0,-1);return render();}
    if(k==="AC"){state.tableEntry="";return render();}
    if(k==="MODE")return modeMenu();
    return;
  }

  if(state.shift && shifted(k)){render();return;}
  if(state.alpha && alphaAction(k)){render();return;}

  if(state.pending==="STO"||state.pending==="RCL"){
    const v=alphaVariableForKey(k);
    if(v){useVariable(v);return;}
  }

  if(/^\d$/.test(k)){insertText(k);clearOneShots();return;}
  switch(k){
    case "SHIFT":state.shift=!state.shift;state.alpha=false;render();return;
    case "ALPHA":state.alpha=!state.alpha;state.shift=false;render();return;
    case "ON":state.history=[];resetExpression();state.resultText="";render("");return;
    case "MODE":modeMenu();return;

    case "INV":

      if(/(?:\^2|\^3|\^-1|\^[^+\-×÷*/]+)$/.test(state.expr)){render();return;}

    case "LOGBASE":

    case "FRAC":
      if(state.io==="MthIO"){
        startFractionTemplate();
      }else{
        startFreshIfNeeded("TEXT");
        const left=state.expr.slice(0,state.cursor),right=state.expr.slice(state.cursor);
        const prev=previousNaturalAtom(left);
        if(prev){
          const ins=`frac(${prev.atom},`;
          state.expr=prev.before+ins+right;
          state.cursor=prev.before.length+ins.length;
        }else{
          insertText("frac(");
        }
        render();
      }
      return;
    case "SQRT":insertText("sqrt(");break;
    case "SQUARE":
      if(state.showingResult){state.expr="Ans";state.cursor=3;state.showingResult=false;}
      if(/(?:\^2|\^3|\^-1|\^[^+\-×÷*/]+)$/.test(state.expr)){render();return;}
      insertText("^2");break;
    case "POWER":
      if(state.showingResult){state.expr="Ans";state.cursor=3;state.showingResult=false;}
      insertText("^","POWER");break;
    case "LOG":insertText("log(");break;
    case "LN":insertText("ln(");break;
    case "NEG":insertText("-");break;
    case "DMS":dmsKey();return;
    case "HYP":hypMenu();return;
    case "SIN":insertText("sin(");break;
    case "COS":insertText("cos(");break;
    case "TAN":insertText("tan(");break;
    case "RCL":state.pending="RCL";render();return;

    case "LP":insertText("(");break;
    case "RP":insertText(")");break;
    case "SD":toggleSD();return;
    case "MPLUS":{

    }
    case "MUL":insertText("×","MUL");break;
    case "DIV":insertText("÷","DIV");break;
    case "PLUS":insertText("+","PLUS");break;
    case "MINUS":insertText("-","MINUS");break;
    case "DOT":insertText(".");break;
    case "EXP":insertText("×10^","EXP");break;
    case "ANS":insertText("Ans");break;
